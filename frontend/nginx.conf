# 生产托管(评审 P0-3)。
#
# 这份配置要同时解决三件在开发服务器下被掩盖的事:
#
#   1. `/api` 与 `/files` 在开发时是 Vite 代理转发的。生产没有 Vite,
#      如果不在这里反代,前端的相对地址(`client.ts` 默认 `/api`、
#      后端返回的 `/files/outputs/…` 图片地址)会全部 404 —— 而这条路径
#      **一次也没有跑过**,所以它是上线当天最可能出事的地方
#   2. SPA 的 history 路由:直接访问 /workbench/xxx 必须回 index.html,
#      否则运营把链接发给同事、同事打开就是 404
#   3. 一条 CSP(评审 P2-7)。**这一条的理由在 a51 改过**:原文是
#      「口令存 localStorage 是明确接受的取舍……能把『任何 XSS 都能读到它』
#      里的『任何』缩小一档」,而 localStorage 口令链已随 PRD §26/§27 退役。
#      现在的理由见 snippets/security-headers.conf 顶部:HttpOnly 挡得住
#      "把 Cookie 读走",挡不住"在这个页面里以当前身份调 API",而后者正是
#      connect-src / script-src 在限制的

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传 CSV / 素材要走这里。**这个数必须大于后端的 MAX_UPLOAD_SIZE_MB(20)。**
    #
    # A-20:原来是 16m,比后端上限还小 4MB。表现是 17–20MB 的素材在生产被
    # nginx 用一张 **HTML 413** 拦下 —— 前端拿到的不是后端那个带 error code
    # 的 JSON,错误提示会退化成"上传失败";而开发直连 Vite 不过 nginx,
    # **只在生产复现**。
    #
    # 24m 而不是 20m:multipart 有边界与文件名开销,正好卡在 20m 会让
    # 一个 19.9MB 的文件随机地过或不过。留 4MB 余量之后,20MB 这条线
    # 由后端来判 —— 那里才有错误码和文案。
    # 契约由 `tests/pure/test_a44_batch3_fixes.py` 钉住,改后端上限时会红。
    client_max_body_size 24m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ------------------------------------------------------------ 安全响应头
    #
    # CSP 里 style-src 必须带 'unsafe-inline':antd v5 是 CSS-in-JS,
    # 运行期往 <style> 里写规则。**这不是随手加的** —— 去掉它整个界面会没有样式。
    # 要收紧的话得给 antd 配 nonce(ConfigProvider 的 csp 选项),那是单独一件事。
    # 四条头收进 snippet(A45-#7)。声明了自己 add_header 的 location 要各自
    # include 一次 —— nginx 的继承是"一条都没有才继承",不是逐条覆盖
    include /etc/nginx/snippets/security-headers.conf;

    # A-43:两处都改了。
    #
    #   1. `add_header Content-Type` 设的是**额外的**响应头,不是内容类型。
    #      nginx 自己还会按 `types` 再发一个 —— 客户端可能拿到两个
    #      Content-Type。设内容类型的指令是 `default_type`。
    #   2. **location 里一旦出现 add_header,server 级的 add_header 全部不再继承。**
    #      也就是说上面那四条安全响应头(CSP / nosniff / Referrer-Policy /
    #      X-Frame-Options)在 /healthz 上一条都没有。探活接口本身不敏感,
    #      但"某个 location 悄悄丢掉全部安全头"这个形状会被复制到下一个
    #      location 上,而下一个可能不是探活。
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ------------------------------------------------------------ 后端反代
    #
    # 两个前缀都要。/api 是接口,/files 是后端 mount 的公开素材静态目录
    # (`main.py` 的 `/files/{PUBLIC_STORAGE_PREFIX}`)—— 页面上的 <img src>
    # 走的就是它,漏掉这一段的表现是「界面正常、图片全裂」
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Provider 轮询最长 300s(ComfyUI),网关不能比它先断
        proxy_read_timeout 320s;
    }

    location /files/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ------------------------------------------------------------ 静态资源
    #
    # Vite 产物带内容哈希,可以长缓存;index.html 绝不能缓存,
    # 否则发版后浏览器拿着旧 html 去引用已经不存在的 chunk
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # 上面这一行会切断 server 级的全部安全头,所以要补回来
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        # **这一处最要紧**:SPA 文档本身如果没有 CSP,XSS 就能把当前用户的
        # 登录态用到任何地方去(Cookie 是 HttpOnly,读不走,但**用得了**)。
        # 而切断它的正是上面那行缓存声明。
        # 这里原来说的是"保护 localStorage 里那两把口令",那条口令链已随
        # PRD §26/§27 退役 —— 理由换了,结论不变,详见 snippet 顶部
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
