# 安全响应头。**每一个声明了自己 add_header 的 location 都必须 include 它**(A45-#7)。
#
# nginx 的继承规则:一个 location 只要出现**任何一条** add_header,server 级的
# add_header 就**全部**不再继承 —— 不是被覆盖那一条,是全部。
#
# 所以 `location = /index.html { add_header Cache-Control no-store; }` 这样一行
# 完全正常的缓存声明,会让 CSP / X-Frame-Options / nosniff / Referrer-Policy
# 恰好在 **SPA 文档本身**上消失 —— 而那是整个应用唯一的入口文档。
#
# ## 这里原来写的理由已经过期(a51 订正)
#
# 原文是「而那正是保护 localStorage 里两把口令(C-03)最关键的那一个响应」。
# **那两把口令不存在了**:localStorage 口令链在 PRD §26/§27 整个退役,
# 现在是 HttpOnly 的 Session Cookie,JS 根本读不到它。
#
# 头要留,理由换一个 —— 而且新理由并不更弱:
#
#   HttpOnly 挡住的是"XSS 把 Cookie 读走带到别处",挡不住"XSS 在这个页面里
#   以当前用户的身份直接调 API"。CSP 的 `connect-src 'self'` 限制的正是后者
#   能把数据发到哪儿,`script-src 'self'` 限制的是注入的脚本能不能加载进来。
#   `frame-ancestors 'none'` 则与 Cookie 完全无关(点击劫持)。
#
# 记下来是因为本仓的规矩是「注释写为什么」:一条理由过期而结论恰好仍然正确,
# 是最难发现的一种 —— 下一个人会照着那条不成立的理由去判断该不该动它。
#
# 这个文件存在的理由就是让"补回四条头"变成一行 include,而不是四行复制 ——
# 复制的下场见同仓 saveBlob 那两份实现(A45-#4)。
#
# CSP 里 style-src 必须带 'unsafe-inline':antd v5 是 CSS-in-JS,运行期往
# <style> 里写规则。**这不是随手加的** —— 去掉它整个界面会没有样式。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;
add_header X-Frame-Options DENY always;
