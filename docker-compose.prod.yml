# 生产/类生产编排(评审 P0-3、并配合后端评审 P2-2)。
#
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# 相对 docker-compose.yml 的四处差别,每一处都对应一条评审意见:
#
#   1. 前端从 Vite 开发服务器换成**构建产物 + Nginx**(P0-3)
#   2. backend 不再对外发布端口 —— 唯一入口是 Nginx,由它反代 /api 与 /files
#      (后端 P2-2:「发布到 0.0.0.0 等于把 API 层的口令整个绕开」,
#       而默认配置下 API 层根本没有口令)
#   3. backend 去掉 `--reload` 与源码 bind mount
#   4. 不再需要 CORS —— 前后端同源了
#
# **这份文件在交付时没有被验证过**(打包环境无网络、装不上 node_modules)。
# 第一次用它之前先跑一次 `make fe-build`,那一步会把类型错误和构建错误暴露出来。

# 浏览器登录的三项,生产必填 —— **这不是加严,是把已经存在的强制搬到看得见的地方。**
#
# `config._check_browser_auth` 早就规定:非 local 环境三项配不全**直接抛错、
# 进程起不来**。而这份 overlay 原来一个字都没提它们,于是部署的人遇到的是:
# `docker compose up -d` 报成功、backend 容器起来又退出、退出又重启,
# 日志里那句「ADMIN_PASSWORD 为空」被淹在几十行启动输出里,而 `ps` 只显示
# Restarting。全仓也没有任何一份文档提过这三个名字(本轮一起补进 README)。
#
# `:?` 把这件事提前到 `docker compose up` 那一刻:变量没设就根本不会创建容器,
# 消息直接打在部署者的终端上。这和上面 POSTGRES_PASSWORD 是同一条理由,
# 也是这份文件文件头第 1 条写的那句「启动失败是个好错误」。
#
# 三个服务都要:worker 与 beat 同样构造 Settings,同样会被那条检查拦住 ——
# 只给 backend 加的话,表现是 API 起来了而任务队列在悄悄重启。
x-browser-auth: &browser-auth
  # 两个密码**不能相同**(config 那边也拦):相同等于两个角色形同一个,
  # 而界面、审计、403 全都按"这是两个人"在工作
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?生产必须设置 ADMIN_PASSWORD(浏览器登录的管理员密码)}
  OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:?生产必须设置 OPERATOR_PASSWORD,且不能与 ADMIN_PASSWORD 相同}
  # 至少 32 字符。生成:python3 -c "import secrets;print(secrets.token_urlsafe(48))"
  # **多机部署各节点必须是同一把** —— 签名 Cookie 是无状态的,各签各的会让
  # 用户"隔一次请求就掉线";而换掉它等于把所有人当场登出
  AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?生产必须设置 AUTH_SESSION_SECRET(至少 32 字符,多机部署各节点必须相同)}

services:
  # R1-37:**生产不许回落到弱默认口令。**
  #
  # `docker-compose.yml` 里写的是 `${POSTGRES_PASSWORD:-imagegen}` —— 开发用
  # 那个默认值是对的(一条命令就能起来),但这份 overlay 原来一个字都没覆盖它,
  # 于是"生产编排"和"开发编排"用的是同一把口令 `imagegen`,而且**不设也能起来**。
  #
  # 去掉 `:-` 之后没配就起不来:compose 会报变量未设置。启动失败是个好错误 ——
  # 它发生在部署那一刻、由部署的人看到,而不是三个月后由别人发现。
  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?生产必须显式设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?生产必须显式设置 POSTGRES_PASSWORD,不要用开发默认值}
      POSTGRES_DB: ${POSTGRES_DB:?生产必须显式设置 POSTGRES_DB}

  # 迁移是一次性作业,不是某个长驻进程的开场白。
  #
  # ## 它换掉的是什么
  #
  # 原来 `backend` 的启动命令是 `alembic upgrade head && uvicorn ...`。单副本
  # 时没问题,但把「schema 变更」绑在「进程启动」上有两个后果:
  #
  #   1. 扩到多副本(或遇上重启风暴)时,多个容器并发跑迁移。Alembic 有
  #      version 表,**但没有跨进程锁** —— 并发升级的表现是随机失败或部分应用。
  #   2. 回滚一次部署会连带触发一次迁移路径,而那通常不是回滚的人想要的。
  #
  # ## 为什么不是 `profiles: [migrate]`
  #
  # 评审给的两个选项里,profile 那个会砸掉「一条命令部署」:挂了 profile 之后
  # `docker compose -f ... -f prod up -d` **不带**这个 service,而 worker 与 beat
  # 照旧起来 —— 于是一个「并发迁移」被换成了一个更安静的「静默跑在旧表上」。
  #
  # 这里用的是第三种写法:不挂 profile,做成一次性 service,让三个长驻服务
  # `depends_on` 它跑完。得到的性质和 profile 方案想要的一样 ——
  #
  #     迁移只执行一次     它是**一个 service**,`--scale backend=2` 复制的是 backend,不是它
  #     不绑在进程启动上   backend 的 command 里已经没有 alembic
  #     一条命令仍然可用   compose 会先跑完它再起后面三个
  #
  # 手动单独跑一次用 `make migrate-prod`,那条命令复用的正是这个 service。
  #
  # ## 有一种失败是**设计好的**,遇上时别当成部署系统坏了
  #
  # 迁移 0034 在库里已有重复 submit 计费流水时会**拒绝升级并列出重复项** ——
  # PRD §13 阶段 P0 写明「那要求先人工对账,是刻意行为不是缺陷」。
  #
  # 改成一次性 service 之后,这条拒绝的**表现变了**,要说清楚:
  #
  #     改之前   backend 容器反复重启,postgres / redis / frontend 照常在,
  #              那句拒绝淹在几十行启动日志里,而 `ps` 只显示 Restarting
  #     改之后   migrate 退出非零 -> 后面三个服务**根本不被创建**,
  #              而 compose 会把 migrate 的日志直接打在部署者的终端上
  #
  # 后者更响,也更早,方向是对的 —— 但第一次遇上的人看到的是「整套起不来」,
  # 很容易读成部署坏了。真正该做的是:去看 migrate 的输出,按它列出的重复项
  # 人工对账,对完再 `docker compose up -d`。数据库那边不需要回滚任何东西 ——
  # 0034 是拒绝执行,不是执行了一半。
  migrate:
    build: ./backend
    env_file: .env
    environment:
      <<: *browser-auth
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      STORAGE_LOCAL_DIR: /data/storage
      SETTINGS_KEY_DIR: /data/secrets
    command: alembic upgrade head
    # 跑完就退出。不写这一行的话 compose 默认 `no` 也是对的,写出来是因为
    # 「它退出是正常结束」这件事需要被下一个读的人看见 —— 一个 Exited(0)
    # 的容器躺在 `docker compose ps` 里,很容易被当成挂了
    restart: "no"
    volumes:
      - storage:/data/storage
      - secrets:/data/secrets
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    # `environment` 按键合并,不是整段替换 —— 基座那四项(POSTGRES_HOST 等)
    # 原样保留,这里只是往上加三项
    environment: *browser-auth
    # 迁移已经摘出去了(见上面的 migrate)。这里只剩起进程这一件事
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    # `depends_on` 按 service 名合并,基座那两项(postgres / redis 健康)保留
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports: !reset []
    # A45-#6:**`!reset` 不能省。**
    #
    # Compose 的 `volumes` 按**容器路径合并**,不是整段替换。这里原来只重列了
    # storage 与 secrets,于是基座里的 `./backend:/app` 原样保留 —— 文件头
    # 第 3 条"去掉 --reload 与源码 bind mount"因此不成立。
    #
    # 在没有源码 checkout 的部署机上,那个空目录会盖住镜像里的代码,三个服务
    # 全部起不来,而现象(ModuleNotFoundError / 找不到 app)完全不指向
    # volumes 合并。同文件的 `ports` 与 `image` 都记得写 `!reset`,
    # 所以这是一处遗漏而不是取舍。
    #
    # 用 `!override` 而不是 `!reset`:`!reset` 是清空,清完就没法在同一个键上
    # 再列;`!override` 是"这一段整体替换基座那一段",正是这里要的语义。
    volumes: !override
      - ./sample-data:/sample-data:ro
      - storage:/data/storage
      - secrets:/data/secrets

  worker:
    environment: *browser-auth
    # 同 backend:不 override 的话基座的 ./backend:/app 会原样合并进来(A45-#6)
    volumes: !override
      - storage:/data/storage
      - secrets:/data/secrets
    # 基座里 worker 等的是 `backend: service_healthy`,而那条依赖当初的理由
    # 写在基座的注释里:「迁移在 backend 启动命令里跑」。迁移搬走之后那个理由
    # 不再成立,所以这里把依赖直接指向迁移本身 —— 否则 worker 的正确性
    # 取决于「backend 恰好先起来过」,而那是一个巧合,不是一条约束
    depends_on:
      migrate:
        condition: service_completed_successfully

  beat:
    environment: *browser-auth
    # 同上
    volumes: !override
      - storage:/data/storage
      - secrets:/data/secrets
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    image: !reset null
    build:
      context: ./frontend
    working_dir: !reset null
    command: !reset null
    environment: !reset null
    volumes: !reset []
    # 只绑本机。要对外服务时在前面再套一层带 TLS 的反代,
    # 不要把这一层直接发布到 0.0.0.0
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
